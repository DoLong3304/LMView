# Prometheus Configuration for Lambda Architecture Crypto Platform
# Scrapes metrics from FastAPI, Kafka, Flink, and Node Exporter

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'crypto-platform'
    environment: 'production'

# Alertmanager configuration (optional - for future use)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # FastAPI metrics
  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Kafka Exporter metrics
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
    scrape_interval: 15s

  # Flink JobManager metrics
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:9249']
    scrape_interval: 15s

  # Flink TaskManager metrics
  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9249']
    scrape_interval: 15s

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # ─── MinIO: native Prometheus endpoint (auth: MINIO_PROMETHEUS_AUTH_TYPE=public)
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

  # ─── Trino: JMX Prometheus Java Agent (port 9404)
  - job_name: 'trino'
    static_configs:
      - targets: ['trino:9404']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ─── Redis Sentinel HA: redis_exporter sidecar
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # ─── Kafka JVM: JMX Prometheus Java Agent (ports 9999 per broker)
  - job_name: 'kafka-jvm'
    static_configs:
      - targets:
          - 'kafka-1:9999'
          - 'kafka-2:9999'
          - 'kafka-3:9999'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ─── Spark: Prometheus Servlet (built-in Spark metrics sink)
  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8090']
    metrics_path: '/metrics/master/prometheus'
    scrape_interval: 30s

  - job_name: 'spark-worker'
    static_configs:
      - targets: ['spark-worker:8091']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 30s
