# Spark Metrics Configuration — Prometheus Servlet sink
# Enables /metrics/master/prometheus and /metrics/prometheus endpoints
# Mount this file as $SPARK_CONF_DIR/metrics.properties
# Source: Spark 3.5 built-in PrometheusServlet

# ─── Master metrics ──────────────────────────────────────────────────────────

# Enable Prometheus servlet for Master
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# Master-specific: expose at /metrics/master/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus

# ─── Worker metrics ──────────────────────────────────────────────────────────

worker.sink.prometheusServlet.path=/metrics/worker/prometheus

# ─── Application (driver) metrics ───────────────────────────────────────────

application.sink.prometheusServlet.path=/metrics/application/prometheus

# ─── Executor metrics ────────────────────────────────────────────────────────

executor.sink.prometheusServlet.path=/metrics/executor/prometheus

# ─── What to include ────────────────────────────────────────────────────────

# Default source hierarchy (includes jvm, memory, etc.)
# *.source.jvm.class=org.apache.spark.metrics.source.JvmSource
# *.source.threadPool.class=org.apache.spark.metrics.source.ThreadPoolSource

# JVM metrics (always included for Master/Worker/Driver/Executor)
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
application.source.jvm.class=org.apache.spark.metrics.source.JvmSource
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# ClassLoader metrics
master.source.ClassLoader.class=org.apache.spark.metrics.source.ClassLoaderSource
worker.source.ClassLoader.class=org.apache.spark.metrics.source.ClassLoaderSource

# Only include necessary sources to keep metric cardinality low
# Drop: TaskMetrics (too high cardinality per task)
