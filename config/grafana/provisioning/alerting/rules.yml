apiVersion: 1

groups:
  # ═══════════════════════════════════════════════════════════════════════════
  # FLINK ALERTS
  # ═══════════════════════════════════════════════════════════════════════════
  - name: flink_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: flink_job_restarting
        title: Flink Job Restarting
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: rate(flink_jobmanager_job_uptime[5m]) > 0
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Flink job restarting frequently"
          description: "Flink job has restarted in the last 5 minutes"
        labels:
          severity: critical

      - uid: flink_high_memory
        title: Flink High Memory Usage
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (flink_taskmanager_Status_JVM_Memory_Heap_Used / flink_taskmanager_Status_JVM_Memory_Heap_Max) > 0.9
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Flink TaskManager memory usage > 90%"
          description: "TaskManager heap memory usage is critically high"
        labels:
          severity: warning

  # ═══════════════════════════════════════════════════════════════════════════
  # KAFKA ALERTS
  # ═══════════════════════════════════════════════════════════════════════════
  - name: kafka_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: kafka_consumer_lag_high
        title: Kafka Consumer Lag High
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: kafka_consumergroup_lag > 10000
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kafka consumer lag too high"
          description: "Consumer group lag exceeds 10,000 messages"
        labels:
          severity: warning

      - uid: kafka_broker_down
        title: Kafka Broker Down
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: Prometheus
            model:
              expr: kafka_brokers < 3
              refId: A
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: "Kafka broker count below expected"
          description: "Less than 3 Kafka brokers are active"
        labels:
          severity: critical

  # ═══════════════════════════════════════════════════════════════════════════
  # API ALERTS
  # ═══════════════════════════════════════════════════════════════════════════
  - name: api_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: api_high_latency
        title: API High Latency
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="fastapi"}[5m])) > 1
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "API p95 latency > 1s"
          description: "95th percentile response time exceeds 1 second"
        labels:
          severity: warning

      - uid: api_high_error_rate
        title: API High Error Rate
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (rate(http_requests_total{job="fastapi",status=~"5.."}[5m]) / rate(http_requests_total{job="fastapi"}[5m])) > 0.05
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "API error rate > 5%"
          description: "More than 5% of requests are returning 5xx errors"
        labels:
          severity: critical

  # ═══════════════════════════════════════════════════════════════════════════
  # SYSTEM ALERTS
  # ═══════════════════════════════════════════════════════════════════════════
  - name: system_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: high_memory_usage
        title: High Memory Usage
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Server memory usage > 90%"
          description: "System memory usage is critically high"
        labels:
          severity: critical

      - uid: high_cpu_usage
        title: High CPU Usage
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.9
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Server CPU usage > 90%"
          description: "System CPU usage is critically high"
        labels:
          severity: warning


  # ??????????????????????????????????????????????????????????????????????????
  # POSTGRES ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: postgres_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: postgres_connections_high
        title: Postgres Connection Pool Exhausted
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Postgres connections > 80%"
          description: "Active connections exceed 80% of max_connections"
        labels:
          severity: warning

      - uid: postgres_replication_lag
        title: Postgres Replication Lag
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: pg_stat_replication_replay_lag_seconds > 10
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Postgres replication lag > 10s"
          description: "Replication replay lag exceeds 10 seconds"
        labels:
          severity: critical

  # ??????????????????????????????????????????????????????????????????????????
  # INFLUXDB ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: influxdb_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: influxdb_write_failure
        title: InfluxDB Write Failure Rate
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: rate(http_request_errors_total{job="influxdb"}[5m]) > 0
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "InfluxDB write errors detected"
          description: "InfluxDB HTTP write error rate > 0"
        labels:
          severity: warning

  # ??????????????????????????????????????????????????????????????????????????
  # NGINX ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: nginx_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: nginx_5xx_spike
        title: Nginx 5xx Spike
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (sum(rate(nginx_http_requests_total{status=~"5.."}[5m])) / sum(rate(nginx_http_requests_total[5m]))) > 0.05
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Nginx 5xx error rate > 5%"
          description: "More than 5% of Nginx requests are returning 5xx errors"
        labels:
          severity: critical

  # ??????????????????????????????????????????????????????????????????????????
  # ZOOKEEPER ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: zookeeper_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: zookeeper_leader_election
        title: Zookeeper Leader Election
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: changes(zk_leader_uptime_seconds[5m]) > 0
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Zookeeper leader election detected"
          description: "A leader election occurred in the last 5 minutes"
        labels:
          severity: warning

  # ??????????????????????????????????????????????????????????????????????????
  # DAGSTER ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: dagster_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: dagster_pipeline_failure
        title: Dagster Pipeline Failure
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: increase(dagster_pipeline_run_failure_total[5m]) > 0
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Dagster pipeline run failed"
          description: "A Dagster pipeline run has failed in the last 5 minutes"
        labels:
          severity: warning

  # ??????????????????????????????????????????????????????????????????????????
  # PRODUCER ALERTS
  # ??????????????????????????????????????????????????????????????????????????
  - name: producer_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: producer_ws_disconnect
        title: Producer WS Disconnect
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: increase(producer_ws_reconnections_total[5m]) > 3
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Producer WebSocket reconnecting frequently"
          description: "Producer has reconnected WebSockets more than 3 times in 5 minutes"
        labels:
          severity: critical

  # ??????????????????????????????????????????????????????????????????????????
  # LOG-BASED ALERTS (Loki datasource)
  # ??????????????????????????????????????????????????????????????????????????
  - name: log_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: error_log_rate_spike
        title: ERROR Log Rate Spike
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              expr: sum(rate({log_level="ERROR"} [5m])) > 10
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "ERROR log rate spike detected"
          description: "ERROR-level logs exceeding 10/minute sustained for 5 minutes across all services"
        labels:
          severity: warning

      - uid: crash_loop_detection
        title: Crash Loop Detection
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              expr: count_over_time({compose_service=~".+"} |~ "Starting|Booting|initialize" [5m]) > 2
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Possible crash loop detected"
          description: "Service startup logs appear more than 2 times in 5 minutes"
        labels:
          severity: critical

      - uid: kafka_broker_disconnect_log
        title: Kafka Broker Disconnect Log
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Loki
            model:
              expr: count_over_time({service=~"kafka-.*"} |~ "(?i)disconnect|connection reset" [5m]) > 0
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Kafka broker disconnect detected in logs"
          description: "Kafka broker logs contain disconnect or connection reset messages"
        labels:
          severity: warning
