apiVersion: 1

# ══════════════════════════════════════════════════════════════════════════════
# Notification policies — routing tree
# ══════════════════════════════════════════════════════════════════════════════
# A notification policy decides which contact point receives an alert, with
# what severity, and at what grouping. Policies are evaluated top-to-bottom;
# the first match wins.
#
# Tree layout:
#
#   Default (everything else)
#     ├─ Critical severity → PagerDuty + Slack #lmview-alerts
#     ├─ Frontend folder   → Slack #lmview-frontend
#     ├─ Security folder   → PagerDuty (high prio) + email
#     └─ SLO burn rate     → Slack #lmview-slo (no pages during business hours)
#
# To change the routing, edit the `receiver` and `continue` fields below.
# Use ``continue: true`` to also fire the parent policy's receiver.
#
# Format note (Grafana 10+): policies MUST be nested under a single root
# policy's `routes:` list. A flat sibling list (where every policy is a
# top-level entry under `policies:`) triggers the error
# "cannot have continue in root route" because Grafana treats the FIRST
# entry as the root, and only root-level routes are allowed to be at
# the same level. Child routes must be under `routes:`.

policies:
  # Default root policy
  - orgId: 1
    receiver: internal-log
    group_by:
      - grafana_folder
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # ── Critical: page on-call + notify #lmview-alerts ─────────────
      - receiver: pagerduty
        object_matchers:
          - ["severity", "=", "critical"]
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
        continue: true

      - receiver: slack
        object_matchers:
          - ["severity", "=", "critical"]
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
        continue: false

      # ── Warning: post to Slack only, no pages ──────────────────────
      - receiver: slack
        object_matchers:
          - ["severity", "=", "warning"]
        group_by:
          - grafana_folder
          - alertname
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 4h
        continue: false

      # ── Info: log only, no notifications ──────────────────────────
      - receiver: internal-log
        object_matchers:
          - ["severity", "=", "info"]
        group_by:
          - alertname
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 24h
        continue: false

      # ── Frontend: dedicated channel ───────────────────────────────
      - receiver: slack
        object_matchers:
          - ["grafana_folder", "=", "LMView / Frontend"]
        group_by:
          - alertname
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 4h
        continue: false

      # ── Security: page + email ────────────────────────────────────
      - receiver: pagerduty
        object_matchers:
          - ["grafana_folder", "=", "LMView / Security"]
        group_by:
          - alertname
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
        continue: true

      - receiver: email
        object_matchers:
          - ["grafana_folder", "=", "LMView / Security"]
        group_by:
          - alertname
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
        continue: false

      # ── SLO burn rate: Slack only (no pages during 09:00-18:00 UTC) ─
      - receiver: slack
        object_matchers:
          - ["grafana_folder", "=", "Alerts"]
          - ["alertname", "=~", "slo_.*"]
        group_by:
          - alertname
        group_wait: 5m
        group_interval: 15m
        repeat_interval: 4h
        # Mute window: 09:00 - 18:00 UTC Monday-Friday.
        # The actual mute timing is configured separately under
        # mute_timings/ in the same provisioning directory.
        continue: false
