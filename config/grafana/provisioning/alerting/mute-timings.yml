apiVersion: 1

# ══════════════════════════════════════════════════════════════════════════════
# Mute timings — schedule windows where notifications are paused
# ══════════════════════════════════════════════════════════════════════════════
# Mute timings are referenced by name in notification-policies.yml via
# ``mute_time_intervals``. They use the standard ical/rrulestring format.
#
# Current schedule:
#   * ``business_hours`` — 09:00-18:00 UTC Mon-Fri (used for SLO warnings
#     so on-call doesn't get paged for slow-burn SLO breaches during
#     business hours when engineering is already on the call).

muteTimes:
  - orgId: 1
    name: business_hours
    time_intervals:
      - times:
          - start_time: "09:00"
            end_time: "18:00"
        weekdays:
          - monday:friday
        location: UTC

  - orgId: 1
    name: weekend
    time_intervals:
      - weekdays:
          - saturday
          - sunday
        location: UTC
