server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[(?P<log_level>\w+)\]'
      - labels:
          log_level:
      - regex:
          expression: '(?i)(?P<error_type>Exception|Error|Fatal|Traceback|panic|OOM|timeout)'
      - labels:
          error_type:
      - match:
          selector: '{log_level!=""}'
          stages:
            - timestamp:
                source: timestamp
                format: '2006-01-02 15:04:05'
      - match:
          selector: '{log_level=""}'
          stages:
            - regex:
                expression: '(?i)(?P<log_level>ERROR|WARN|INFO|DEBUG|TRACE)'
            - labels:
                log_level:
      - output:
          source: message
