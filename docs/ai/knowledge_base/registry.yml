# Knowledge Base Registry — LMView

# Each source is a collection of related documents that share metadata.
# Documents are ingested from docs/ai/knowledge_base/approved/
# Only sources with allowed_for_rag: true and review_status: approved are
# retrievable in production RAG queries.

sources:

