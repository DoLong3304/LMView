# ─────────────────────────────────────────────────────────────────────────────
# Docker Swarm Override — 2-node AWS EC2 deployment
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml lmview \
#     --resolve-image never
#
# Node labels (set once per node):
#   docker node update --label-add role=core  <manager-node>
#   docker node update --label-add role=worker <worker-node>
#
# Machine 1 (role=core):   8 vCPU, 32 GB RAM
#   Storage, databases, brokers, API, frontend, nginx, AI services
#   Memory budget: ~25 GB services + ~5 GB OS/buffers
#
# Machine 2 (role=worker): 4 vCPU, 16 GB RAM
#   Flink, Spark, Trino, Dagster, monitoring, logging
#   Memory budget: ~13 GB services + ~3 GB OS/buffers
#
# Shared EFS mount: /mnt/efs/lmview (code + config sync across nodes)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  crypto-net:
    driver: overlay
    attachable: true

services:

  # ════════════════════════════════════════════════════════════════════════════
  # DATA LAYER — core node (8 vCPU, 32 GB)
  # ════════════════════════════════════════════════════════════════════════════

  zookeeper:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  kafka-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  kafka-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  kafka-3:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  schema-registry:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  minio:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  minio-init:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  influxdb:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  postgres:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # REDIS SENTINEL CLUSTER — core node
  # ════════════════════════════════════════════════════════════════════════════

  redis-master:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-sentinel-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis-sentinel-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis-sentinel-3:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # ════════════════════════════════════════════════════════════════════════════
  # API + FRONTEND + PRODUCER — core node
  # ════════════════════════════════════════════════════════════════════════════

  fastapi-prod:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  nginx-prod:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  certbot-auto:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3

  duckdns-auto:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3

  influx-backfill:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  producer:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # AI SERVICES — core node
  # ════════════════════════════════════════════════════════════════════════════

  ai-service:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 2G

  litellm:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  finbert-worker:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
      resources:
        limits:
          memory: 4G

  # ════════════════════════════════════════════════════════════════════════════
  # COMPUTE LAYER — worker node (4 vCPU, 16 GB)
  # ════════════════════════════════════════════════════════════════════════════

  flink-jobmanager:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  flink-taskmanager:
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  spark-master:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-submit:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-worker:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  spark-worker-2:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  job-watchdog:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3

  auto-submit-jobs:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: none

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY + ORCHESTRATION — worker node
  # ════════════════════════════════════════════════════════════════════════════

  trino:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  dagster-webserver:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  dagster-daemon:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  redis-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  prometheus:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G

  kafka-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  node-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 64M

  grafana:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  # ════════════════════════════════════════════════════════════════════════════
  # LOGGING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  loki:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  promtail:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
