# ─────────────────────────────────────────────────────────────────────────────
# Docker Swarm Override — 2-node AWS EC2 deployment
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml lmview \
#     --resolve-image never
#
# Node labels (set once per node):
#   docker node update --label-add role=core  <manager-node>
#   docker node update --label-add role=worker <worker-node>
#
# Machine 1 (role=core):   8 vCPU, 32 GB RAM
#   Storage, databases, brokers, API, frontend, nginx, AI services
#   Memory budget: ~25 GB services + ~5 GB OS/buffers
#
# Machine 2 (role=worker): 4 vCPU, 16 GB RAM
#   Flink, Spark, Trino, Dagster, monitoring, logging
#   Memory budget: ~13 GB services + ~3 GB OS/buffers
#
# Shared EFS mount: /mnt/efs/lmview (code + config sync across nodes)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  crypto-net:
    driver: overlay
    attachable: true

services:

  # ════════════════════════════════════════════════════════════════════════════
  # DATA LAYER — core node (8 vCPU, 32 GB)
  # ════════════════════════════════════════════════════════════════════════════

  zookeeper:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  kafka-1:
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - /mnt/efs/LMView/config/jmx:/jmx
      - /mnt/efs/LMView/docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  kafka-2:
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - /mnt/efs/LMView/config/jmx:/jmx
      - /mnt/efs/LMView/docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  kafka-3:
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - /mnt/efs/LMView/config/jmx:/jmx
      - /mnt/efs/LMView/docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  schema-registry:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  minio:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  minio-init:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  influxdb:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  postgres:
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /mnt/efs/LMView/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # REDIS SENTINEL CLUSTER — core node
  # ════════════════════════════════════════════════════════════════════════════

  redis-master:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-sentinel-1:
    volumes:
      - /mnt/efs/LMView/docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - /mnt/efs/LMView/docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis-sentinel-2:
    volumes:
      - /mnt/efs/LMView/docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - /mnt/efs/LMView/docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis-sentinel-3:
    volumes:
      - /mnt/efs/LMView/docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - /mnt/efs/LMView/docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # ════════════════════════════════════════════════════════════════════════════
  # API + FRONTEND + PRODUCER — core node
  # ════════════════════════════════════════════════════════════════════════════

  fastapi-prod:
    volumes:
      - /mnt/efs/LMView/ai_service:/app/ai_service
      - /mnt/efs/LMView/backend/api:/app/backend/api
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  nginx-prod:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  certbot-auto:
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - /mnt/efs/LMView/scripts:/scripts:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3

  duckdns-auto:
    volumes:
      - /mnt/efs/LMView/scripts:/scripts:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3

  influx-backfill:
    volumes:
      - /mnt/efs/LMView:/app
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  producer:
    volumes:
      - /mnt/efs/LMView:/app
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G

  # ════════════════════════════════════════════════════════════════════════════
  # AI SERVICES — core node
  # ════════════════════════════════════════════════════════════════════════════

  ai-service:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 2G

  litellm:
    volumes:
      - /mnt/efs/LMView/ai_service/configs/litellm.yaml:/app/config.yaml:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  finbert-worker:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
      resources:
        limits:
          memory: 4G

  # ════════════════════════════════════════════════════════════════════════════
  # COMPUTE LAYER — worker node (4 vCPU, 16 GB)
  # ════════════════════════════════════════════════════════════════════════════

  flink-jobmanager:
    volumes:
      - /mnt/efs/LMView:/app
      - /mnt/efs/LMView/docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7

  flink-taskmanager:
    volumes:
      - /mnt/efs/LMView:/app
      - /mnt/efs/LMView/docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 3.5G
        reservations:
          memory: 1G
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7

  spark-master:
    volumes:
      - /mnt/efs/LMView:/app
      - /mnt/efs/LMView/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - /mnt/efs/LMView/config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-submit:
    volumes:
      - /mnt/efs/LMView:/app:rw
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-worker:
    volumes:
      - /mnt/efs/LMView:/app
      - /mnt/efs/LMView/config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-worker-2:
    volumes:
      - /mnt/efs/LMView:/app
      - /mnt/efs/LMView/config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  job-watchdog:
    volumes:
      - /mnt/efs/LMView:/app:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3

  auto-submit-jobs:
    volumes:
      - /mnt/efs/LMView:/app:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY + ORCHESTRATION — worker node
  # ════════════════════════════════════════════════════════════════════════════

  trino:
    volumes:
      - /mnt/efs/LMView/config/jmx:/etc/trino/jmx:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  dagster-webserver:
    volumes:
      - /mnt/efs/LMView:/app
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  dagster-daemon:
    volumes:
      - /mnt/efs/LMView:/app
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  redis-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  prometheus:
    volumes:
      - prometheus-data:/prometheus
      - /mnt/efs/LMView/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G

  kafka-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  node-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 64M

  grafana:
    volumes:
      - grafana-storage:/var/lib/grafana
      - /mnt/efs/LMView/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - /mnt/efs/LMView/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  # ════════════════════════════════════════════════════════════════════════════
  # LOGGING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  loki:
    volumes:
      - loki-data:/loki
      - /mnt/efs/LMView/config/loki-config.yml:/etc/loki/local-config.yaml:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  promtail:
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /mnt/efs/LMView/config/promtail-config.yml:/etc/promtail/config.yml:ro
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M

# ══════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ══════════════════════════════════════════════════════════════════════════════
# Named volumes are shared across the swarm and persist data between deployments.

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  zookeeper-data:
  minio-data:
  influxdb-data:
  influxdb-config:
  postgres-data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  flink-checkpoints:
  spark-events:
  spark-submit-logs:
  trino-data:
  dagster-home:
  letsencrypt:
  certbot-webroot:
  prometheus-data:
  grafana-storage:
  loki-data:
  flink_deps:
  registry-data:
