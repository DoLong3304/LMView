# ─────────────────────────────────────────────────────────────────────────────
# Docker Swarm Override — 2-node AWS EC2 deployment
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml lmview \
#     --resolve-image never
#
# Node labels (set once per node):
#   docker node update --label-add role=core  <manager-node>
#   docker node update --label-add role=worker <worker-node>
#
# Machine 1 (role=core):   4 vCPU, 32 GB RAM
#   Storage, databases, brokers, API, frontend, nginx, AI services
#   Memory budget: ~25 GB services + ~5 GB OS/buffers
#
# Machine 2 (role=worker): 4 vCPU, 16 GB RAM
#   Flink, Spark, Trino, Dagster, monitoring, logging
#   Memory budget: ~13 GB services + ~3 GB OS/buffers
#
# Shared EFS mount (configurable via AWS_EFS_MOUNT_PATH env var).
# Default: /mnt/efs/LMView (current AWS deployment).
# For a fresh cluster, set AWS_EFS_MOUNT_PATH to wherever the shared
# filesystem is mounted on both nodes (must be identical paths).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  crypto-net:
    driver: overlay
    attachable: true

services:

  # ════════════════════════════════════════════════════════════════════════════
  # DATA LAYER — core node (8 vCPU, 32 GB)
  # ════════════════════════════════════════════════════════════════════════════

  zookeeper:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  kafka-1:
    environment:
      KAFKA_ADVERTISED_HOST: kafka-1
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  kafka-2:
    environment:
      KAFKA_ADVERTISED_HOST: kafka-2
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  kafka-3:
    environment:
      KAFKA_ADVERTISED_HOST: kafka-3
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  schema-registry:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M


  minio:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G

  minio-init:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none


  influxdb:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  postgres:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  # ════════════════════════════════════════════════════════════════════════════
  # REDIS SENTINEL CLUSTER — core node
  # ════════════════════════════════════════════════════════════════════════════

  redis-master:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-replica-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2.5G

  redis-sentinel-1:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 128M

  redis-sentinel-2:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 128M

  redis-sentinel-3:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 128M

  # ════════════════════════════════════════════════════════════════════════════
  # API + FRONTEND + PRODUCER — core node
  # ════════════════════════════════════════════════════════════════════════════

  fastapi-prod:
    environment:
      AI_MODE: ${AI_MODE:-api}
      AI_ORCHESTRATION: ${AI_ORCHESTRATION:-langgraph}
      AI_ENABLE_REAL_LLM: ${AI_ENABLE_REAL_LLM:-true}
      AI_ENABLE_RAG: ${AI_ENABLE_RAG:-true}
      AI_CONFIG_PATH: ${AI_CONFIG_PATH:-ai_service/configs/ai.api.yaml}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_API_KEYS: ${DASHSCOPE_API_KEYS:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_LMVIEW_DB: ${POSTGRES_LMVIEW_DB:-iceberg_catalog}
    volumes:
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}/ai_service:/app/ai_service
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}/backend:/app/backend
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}/src:/app/src
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}/docs:/app/docs
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  nginx-prod:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  certbot-auto:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  duckdns-auto:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
      resources:
        limits:
          memory: 64M

  influx-backfill:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: none

  producer:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      ENABLE_DIRECT_REDIS: "false"
      KLINE_SYMBOLS_PER_CONN: "20"
      DIRECT_REDIS_POOL_SIZE: "50"
      KAFKA_RECONNECT_BACKOFF_MS: "500"
      KAFKA_RECONNECT_BACKOFF_MAX_MS: "10000"
      MAX_PRODUCER_WORKERS: "8"
      PRODUCER_403_BACKOFF_SEC: "60"
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  # ════════════════════════════════════════════════════════════════════════════
  # BINANCE WS TICKER FEED (Phase 4 — replaces dead producer's @ticker path)
  # ════════════════════════════════════════════════════════════════════════════

  binance-ticker-ws:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # COMBINED-STREAM KAFKA PRODUCER — core node
  # ════════════════════════════════════════════════════════════════════════════
  combined-stream-producer:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # AI SERVICES — core node
  # ════════════════════════════════════════════════════════════════════════════

  ai-service:
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lmview-litellm
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    volumes:
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}/ai_service/configs/litellm.yaml:/app/config.yaml:ro
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  finbert-worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ${AWS_EFS_MOUNT_PATH:-/mnt/efs/LMView}:/app:ro
    environment:
      FINBERT_DEVICE: cpu
      FINBERT_PROCESS_INTERVAL: 300
      FINBERT_BATCH_SIZE: 32
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_LMVIEW_DB: ${POSTGRES_LMVIEW_DB:-iceberg_catalog}
    command:
      - bash
      - -c
      - |
        pip install --quiet asyncpg transformers torch --extra-index-url https://download.pytorch.org/whl/cpu &&
        python -m ai_service.nlp.news_processor
    networks:
      - crypto-net
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/finbert_healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ════════════════════════════════════════════════════════════════════════════
  # COMPUTE LAYER — worker node (4 vCPU, 16 GB)
  # ════════════════════════════════════════════════════════════════════════════

  flink-jobmanager:
    environment:
      REDIS_SENTINELS: ""
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
    volumes:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  flink-taskmanager:
    environment:
      REDIS_SENTINELS: ""
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: 1536m
        taskmanager.memory.framework.off-heap.size: 96m
        taskmanager.memory.task.off-heap.size: 256m
        taskmanager.memory.managed.size: 192m
        taskmanager.memory.network.min: 192m
        taskmanager.memory.network.max: 384m
    volumes:
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  spark-master:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-submit:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  spark-worker:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  spark-worker-2:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

  job-watchdog:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3

  auto-submit-jobs:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: none

  # ════════════════════════════════════════════════════════════════════════════
  # QUERY + ORCHESTRATION — worker node
  # ════════════════════════════════════════════════════════════════════════════

  trino:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  dagster-webserver:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  dagster-daemon:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  redis-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  prometheus:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 2G

  kafka-exporter:
    command:
      # Use tasks.<service> for cross-node DNS in Swarm
      - --kafka.server=tasks.kafka-1:9092
      - --kafka.server=tasks.kafka-2:9092
      - --kafka.server=tasks.kafka-3:9092
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M

  node-exporter:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 64M

  grafana:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M

  # ════════════════════════════════════════════════════════════════════════════
  # LOGGING — worker node
  # ════════════════════════════════════════════════════════════════════════════

  loki:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M

  promtail:
    deploy:
      placement:
        constraints: [node.labels.role == worker]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
