name: cryptoprice
networks:
  crypto-net:
    driver: bridge
volumes:
  kafka-1-data: null
  kafka-2-data: null
  kafka-3-data: null
  minio-data: null
  influxdb-data: null
  influxdb-config: null
  postgres-data: null
  redis-master-data: null
  redis-replica-1-data: null
  redis-replica-2-data: null
  redis-sentinel-1-data: null
  redis-sentinel-2-data: null
  redis-sentinel-3-data: null
  flink-checkpoints: null
  spark-events: null
  trino-data: null
  dagster-home: null
  letsencrypt: null
  certbot-webroot: null
  prometheus-data: null
  grafana-data: null
  loki-data: null
services:
  kafka-1:
    image: apache/kafka:3.9.0
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped
    ports:
    - 19092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-1-data:/var/lib/kafka/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
    - core
    - all
  kafka-2:
    image: apache/kafka:3.9.0
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped
    ports:
    - 9093:9092
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-2-data:/var/lib/kafka/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
    - core
    - all
  kafka-3:
    image: apache/kafka:3.9.0
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped
    ports:
    - 9094:9092
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-3-data:/var/lib/kafka/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
    - core
    - all
  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.2.Final
    container_name: schema-registry
    hostname: schema-registry
    restart: unless-stopped
    ports:
    - 8085:8080
    environment:
      QUARKUS_HTTP_PORT: 8080
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
    - core
    - all
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
    - minio-data:/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
    - core
    - all
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: "/bin/sh -c \"\n  mc alias set local http://minio:9000 $$MINIO_ROOT_USER\
      \ $$MINIO_ROOT_PASSWORD;\n  mc mb --ignore-existing local/cryptoprice;\n  mc\
      \ mb --ignore-existing local/flink-checkpoints;\n  echo 'Buckets ready.';\n\"\
      \n"
    networks:
    - crypto-net
    restart: 'no'
    profiles:
    - core
    - all
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    hostname: influxdb
    restart: unless-stopped
    ports:
    - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
    - influxdb-data:/var/lib/influxdb2
    - influxdb-config:/etc/influxdb2
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test:
      - CMD
      - influx
      - ping
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
    - core
    - all
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    ports:
    - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
    - core
    - all
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    hostname: redis-master
    restart: unless-stopped
    ports:
    - 6379:6379
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory 2gb
      --maxmemory-policy allkeys-lru --save 60 1000 --hz 50 --tcp-backlog 511

      '
    volumes:
    - redis-master-data:/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
    - core
    - all
  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    hostname: redis-replica-1
    restart: unless-stopped
    command: 'redis-server --replicaof redis-master 6379 --replica-read-only yes --appendonly
      yes --appendfsync everysec

      '
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
    - redis-replica-1-data:/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
    - core
    - all
  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    hostname: redis-replica-2
    restart: unless-stopped
    command: 'redis-server --replicaof redis-master 6379 --replica-read-only yes --appendonly
      yes --appendfsync everysec

      '
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
    - redis-replica-2-data:/data
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
    - core
    - all
  flink-jobmanager:
    build:
      context: ./docker/flink
    image: cryptoprice/flink:1.18.1
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    ports:
    - 8081:8081
    command: jobmanager
    mem_limit: 2560m
    mem_reservation: 2048m
    deploy:
      resources:
        limits:
          memory: 2560m
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: 'taskmanager.numberOfTaskSlots: 12'
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      FLINK_PARALLELISM: 12
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      KEYDB_1S_RETENTION_DAYS: 1
      KEYDB_1M_RETENTION_DAYS: 7
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    volumes:
    - ./:/app
    - ./docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
    - flink-checkpoints:/tmp/flink-checkpoints
    networks:
    - crypto-net
    depends_on:
      kafka-1:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    profiles:
    - core
    - all
  flink-taskmanager:
    build:
      context: ./docker/flink
    image: cryptoprice/flink:1.18.1
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    mem_limit: 10240m
    mem_reservation: 8192m
    deploy:
      resources:
        limits:
          memory: 10G
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_TASKMANAGER_SLOTS: 12
      FLINK_PROPERTIES: 'taskmanager.numberOfTaskSlots: 12'
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      FLINK_PARALLELISM: 12
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      KEYDB_1S_RETENTION_DAYS: 1
      KEYDB_1M_RETENTION_DAYS: 7
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    volumes:
    - ./:/app
    - ./docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
    - flink-checkpoints:/tmp/flink-checkpoints
    networks:
    - crypto-net
    depends_on:
    - flink-jobmanager
    profiles:
    - core
    - all
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    ports:
    - 7077:7077
    - 8082:8080
    - 18080:18080
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=/opt/spark-events -Dspark.history.ui.port=18080
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      RETENTION_1M_DAYS: 90
    volumes:
    - ./:/app
    - spark-events:/opt/spark-events
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
    - core
    - all
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_WEBUI_PORT: 8084
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
    - ./:/app
    - spark-events:/opt/spark-events
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 4G
    depends_on:
    - spark-master
    profiles:
    - core
    - all
  auto-submit-jobs:
    image: docker:27.0-cli
    container_name: auto-submit-jobs
    restart: 'no'
    entrypoint:
    - sh
    - -c
    - 'apk add --no-cache bash curl >/dev/null && \

      bash /app/scripts/auto_submit_jobs.sh

      '
    environment:
      FLINK_HEALTH_URL: http://flink-jobmanager:8081
      SPARK_HEALTH_URL: http://spark-master:8080
    volumes:
    - ./:/app:ro
    - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - crypto-net
    depends_on:
      flink-jobmanager:
        condition: service_started
      spark-master:
        condition: service_started
    profiles:
    - core
    - all
  trino:
    build:
      context: .
      dockerfile: docker/trino/Dockerfile
    image: cryptoprice/trino:442
    container_name: trino
    hostname: trino
    restart: unless-stopped
    ports:
    - 8083:8080
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - trino-data:/data/trino
    networks:
    - crypto-net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/v1/info
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
    - core
    - all
  dagster-webserver:
    build:
      context: ./docker/dagster
    image: cryptoprice/dagster:latest
    container_name: dagster-webserver
    hostname: dagster-webserver
    restart: unless-stopped
    ports:
    - 3000:3000
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/orchestration/workspace.yaml
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_PG_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - ./:/app
    - dagster-home:/dagster-home
    - spark-events:/opt/spark-events
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
    - postgres
    - spark-master
    profiles:
    - core
    - all
  dagster-daemon:
    build:
      context: ./docker/dagster
    image: cryptoprice/dagster:latest
    container_name: dagster-daemon
    restart: unless-stopped
    command: dagster-daemon run -w /app/orchestration/workspace.yaml
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_PG_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_1M_DAYS: 90
    volumes:
    - ./:/app
    - dagster-home:/dagster-home
    - spark-events:/opt/spark-events
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
    - dagster-webserver
    profiles:
    - core
    - all
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: fastapi
    hostname: fastapi
    ports:
    - 8080:8000
    restart: unless-stopped
    environment:
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      CORS_ORIGINS: '*'
      TRINO_HOST: trino
      TRINO_PORT: 8080
    networks:
    - crypto-net
    depends_on:
      redis-master:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      trino:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
    - core
    - all
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: cryptoprice/nginx:latest
    container_name: nginx
    hostname: nginx
    ports:
    - 80:80
    - 443:443
    environment:
    - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-localhost}
    - NGINX_AUTO_RELOAD_ENABLE=${NGINX_AUTO_RELOAD_ENABLE:-1}
    - NGINX_RELOAD_INTERVAL_SECONDS=${NGINX_RELOAD_INTERVAL_SECONDS:-21600}
    volumes:
    - letsencrypt:/etc/letsencrypt
    - certbot-webroot:/var/www/certbot
    restart: unless-stopped
    networks:
    - crypto-net
    depends_on:
      fastapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
    - core
    - all
  certbot-auto:
    image: certbot/certbot:latest
    container_name: certbot-auto
    restart: unless-stopped
    environment:
    - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-}
    - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    - CERTBOT_RENEW_INTERVAL_SECONDS=${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    volumes:
    - letsencrypt:/etc/letsencrypt
    - certbot-webroot:/var/www/certbot
    - ./scripts:/scripts:ro
    entrypoint:
    - sh
    - /scripts/certbot_auto.sh
    depends_on:
      nginx:
        condition: service_started
    profiles:
    - core
    - all
  duckdns-auto:
    image: curlimages/curl:8.7.1
    container_name: duckdns-auto
    restart: unless-stopped
    environment:
    - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    - DUCKDNS_SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-}
    - DUCKDNS_UPDATE_INTERVAL_SECONDS=${DUCKDNS_UPDATE_INTERVAL_SECONDS:-300}
    volumes:
    - ./scripts:/scripts:ro
    command:
    - sh
    - /scripts/duckdns_auto.sh
    profiles:
    - core
    - all
  influx-backfill:
    build:
      context: .
      dockerfile: docker/backfill/Dockerfile
    container_name: influx-backfill
    restart: 'no'
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    networks:
    - crypto-net
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
    - core
    - all
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: producer
    hostname: producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KLINE_INTERVAL: 1s
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    volumes:
    - ./:/app
    networks:
    - crypto-net
    depends_on:
      kafka-1:
        condition: service_healthy
    profiles:
    - core
    - all
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
    - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    ports:
    - 9090:9090
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: &id001
    - monitoring
    - all
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    restart: unless-stopped
    command:
    - --kafka.server=kafka-1:9092
    - --kafka.server=kafka-2:9092
    - --kafka.server=kafka-3:9092
    ports:
    - 9308:9308
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 128m
    profiles: *id001
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
    - --path.rootfs=/host
    volumes:
    - /:/host:ro,rslave
    ports:
    - 9100:9100
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 64m
    profiles: *id001
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_ROOT_URL=http://localhost:3001
    - GF_INSTALL_PLUGINS=
    volumes:
    - grafana-data:/var/lib/grafana
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 3001:3000
    networks:
    - crypto-net
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: *id001
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    hostname: loki
    restart: unless-stopped
    volumes:
    - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
    - loki-data:/loki
    ports:
    - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    networks:
    - crypto-net
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3100/ready
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: &id002
    - logging
    - all
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    hostname: promtail
    restart: unless-stopped
    volumes:
    - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
    - crypto-net
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    profiles: *id002
