name: cryptoprice

# ─────────────────────────────────────────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────────────────────────────────────────
networks:
  crypto-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  zookeeper-data:
  minio-data:
  influxdb-data:
  influxdb-config:
  postgres-data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  flink-checkpoints:
  spark-events:
  spark-submit-logs:
  trino-data:
  dagster-home:
  letsencrypt:
  certbot-webroot:
  prometheus-data:
  grafana-data:
  loki-data:
  flink_deps:

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # DATA LAYER
  # ══════════════════════════════════════════════════════════════════════════════

  zookeeper:
    profiles: ["dev", "prod"]
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
      - "7071:7071"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=7071 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      crypto-net:
        aliases:
          - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    profiles: ["dev", "prod"]
    image: apache/kafka:3.9.0
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped
    ports:
      - "19092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./config/jmx:/jmx
      - ./docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    networks:
      crypto-net:
        aliases:
          - kafka-1
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-2:
    profiles: ["dev", "prod"]
    image: apache/kafka:3.9.0
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "9093:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./config/jmx:/jmx
      - ./docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    networks:
      crypto-net:
        aliases:
          - kafka-2
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-3:
    profiles: ["dev", "prod"]
    image: apache/kafka:3.9.0
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "9094:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./config/jmx:/jmx
      - ./docker/kafka/entrypoint.sh:/entrypoint.sh:ro
    networks:
      crypto-net:
        aliases:
          - kafka-3
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════════
  # SCHEMA REGISTRY  (Apicurio — Confluent-compatible API)
  # ═══════════════════════════════════════════════════════════════════════════════

  schema-registry:
    profiles: ["dev", "prod"]
    image: apicurio/apicurio-registry-mem:2.6.2.Final
    container_name: schema-registry
    hostname: schema-registry
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    profiles: ["dev", "prod"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # MinIO bucket init - runs once then exits
  minio-init:
    profiles: ["dev", "prod"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/cryptoprice;
        mc mb --ignore-existing local/flink-checkpoints;
        echo 'Buckets ready.';
      "
    networks:
      - crypto-net
    restart: "no"

  influxdb:
    profiles: ["dev", "prod"]
    image: influxdb:2.7
    container_name: influxdb
    hostname: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    profiles: ["dev", "prod"]
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════════════════════════
  # REDIS SENTINEL CLUSTER (High Availability)
  # ══════════════════════════════════════════════════════════════════════════════

  redis-master:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-master
    hostname: redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --hz 50
      --tcp-backlog 511
    volumes:
      - redis-master-data:/data
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-replica-1:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-replica-1
    hostname: redis-replica-1
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis-master 6379
      --replica-read-only yes
      --appendonly yes
      --appendfsync everysec
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis-replica-1-data:/data
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-replica-2:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-replica-2
    hostname: redis-replica-2
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis-master 6379
      --replica-read-only yes
      --appendonly yes
      --appendfsync everysec
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis-replica-2-data:/data
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-sentinel-1:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-sentinel-1
    hostname: redis-sentinel-1
    restart: unless-stopped
    ports:
      - "26379:26379"
    entrypoint: ["sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - ./docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
      - redis-sentinel-1-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-sentinel-2:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-sentinel-2
    hostname: redis-sentinel-2
    restart: unless-stopped
    ports:
      - "26380:26379"
    entrypoint: ["sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - ./docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
      - redis-sentinel-2-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis-sentinel-3:
    profiles: ["dev", "prod"]
    image: redis:7.2-alpine
    container_name: redis-sentinel-3
    hostname: redis-sentinel-3
    restart: unless-stopped
    ports:
      - "26381:26379"
    entrypoint: ["sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel.conf
      - ./docker/redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh
      - redis-sentinel-3-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ══════════════════════════════════════════════════════════════════════════════
  # COMPUTE LAYER
  # ══════════════════════════════════════════════════════════════════════════════

  flink-jobmanager:
    profiles: ["dev", "prod"]
    build:
      context: ./docker/flink
    image: cryptoprice/flink:1.18.1
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081" # Flink Web UI
    command: jobmanager
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: "taskmanager.numberOfTaskSlots: 12"
      FLINK_CHECKPOINT_DIR: s3a://flink-checkpoints/flink-checkpoints
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      FLINK_PARALLELISM: 12
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      KEYDB_1S_RETENTION_DAYS: 1
      KEYDB_1M_RETENTION_DAYS: 7
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ./:/app
      - ./docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - crypto-net
    depends_on:
      kafka-1:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  flink-taskmanager:
    profiles: ["dev", "prod"]
    build:
      context: ./docker/flink
    image: cryptoprice/flink:1.18.1
    hostname: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6123 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_TASKMANAGER_SLOTS: 12
      FLINK_PROPERTIES: "taskmanager.numberOfTaskSlots: 12"
      FLINK_CHECKPOINT_DIR: s3a://flink-checkpoints/flink-checkpoints
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      FLINK_PARALLELISM: 12
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      KEYDB_1S_RETENTION_DAYS: 1
      KEYDB_1M_RETENTION_DAYS: 7
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    volumes:
      - ./:/app
      - ./docker/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - crypto-net
    depends_on:
      - flink-jobmanager

  spark-master:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: cryptoprice/spark:3.5.5
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    ports:
      - "7077:7077"
      - "8082:8080" # Spark Master UI
      - "18080:18080" # Spark History Server
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/opt/spark-events -Dspark.history.ui.port=18080 -Dspark.history.fs.cleaner.enabled=true -Dspark.history.fs.cleaner.interval=1d -Dspark.history.fs.cleaner.maxAge=3d"
      SPARK_CONF_DIR: /opt/spark/conf
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      RETENTION_1M_DAYS: 90
    volumes:
      - ./:/app
      - spark-events:/opt/spark-events
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  spark-submit:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/spark-submit/Dockerfile
    image: cryptoprice/spark-submit:local
    container_name: spark-submit
    hostname: spark-submit
    restart: unless-stopped
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/app:rw
      - spark-submit-logs:/var/log/spark-submit
    depends_on:
      spark-master:
        condition: service_started
      kafka-1:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f SparkSubmit > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  spark-worker:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: cryptoprice/spark:3.5.5
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8084
      SPARK_CONF_DIR: /opt/spark/conf
      # ── Disk-bleed fix: auto-purge finished app work dirs older than 1h ──
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=3600"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/${SPARK_WORKER_WEBUI_PORT:-8084} && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ./:/app
      - spark-events:/opt/spark-events
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - spark-master

  spark-worker-2:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: cryptoprice/spark:3.5.5
    container_name: spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8085 && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8085
      SPARK_CONF_DIR: /opt/spark/conf
      # ── Disk-bleed fix: auto-purge finished app work dirs older than 1h ──
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=3600"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./:/app
      - spark-events:/opt/spark-events
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - spark-master

  job-watchdog:
    profiles: ["dev", "prod"]
    image: docker:27.0-cli
    container_name: job-watchdog
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache bash curl python3 >/dev/null && python3 /app/scripts/job_watchdog.py
    environment:
      FLINK_HEALTH_URL: http://flink-jobmanager:8081
      SPARK_HEALTH_URL: http://spark-master:8080
      JOB_WATCHDOG_INTERVAL_SEC: 300
    volumes:
      - ./:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - crypto-net
    depends_on:
      flink-jobmanager:
        condition: service_started
      spark-master:
        condition: service_started

  auto-submit-jobs:
    profiles: ["dev", "prod"]
    build:
      context: ./docker/flink
    image: cryptoprice/flink:1.18.1
    container_name: auto-submit-jobs
    restart: "no"
    command: ["/bin/bash", "/app/scripts/auto_submit_jobs.sh"]
    environment:
      FLINK_HEALTH_URL: http://flink-jobmanager:8081
      SPARK_HEALTH_URL: http://spark-master:8080
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FLINK_CHECKPOINT_DIR: s3a://flink-checkpoints/flink-checkpoints
      FLINK_PARALLELISM: 12
    volumes:
      - ./:/app:ro
    networks:
      - crypto-net
    depends_on:
      flink-jobmanager:
        condition: service_started
      spark-master:
        condition: service_started

  # ══════════════════════════════════════════════════════════════════════════════
  # QUERY + ORCHESTRATION LAYER
  # ══════════════════════════════════════════════════════════════════════════════

  trino:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/trino/Dockerfile
    image: cryptoprice/trino:442
    container_name: trino
    hostname: trino
    restart: unless-stopped
    ports:
      - "8083:8080" # Trino UI (avoid conflict with spark UI on 8082)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - trino-data:/data/trino
      - ./config/jmx:/etc/trino/jmx:ro
    networks:
      - crypto-net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  dagster-webserver:
    profiles: ["dev", "prod"]
    build:
      context: ./docker/dagster
    image: cryptoprice/dagster:1.8.10
    container_name: dagster-webserver
    hostname: dagster-webserver
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/orchestration/workspace.yaml
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_PG_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/app
      - dagster-home:/dagster-home
      - spark-events:/opt/spark-events
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - postgres
      - spark-master

  dagster-daemon:
    profiles: ["dev", "prod"]
    build:
      context: ./docker/dagster
    image: cryptoprice/dagster:1.8.10
    container_name: dagster-daemon
    restart: unless-stopped
    command: dagster-daemon run -w /app/orchestration/workspace.yaml
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_PG_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_1M_DAYS: 90
    volumes:
      - ./:/app
      - dagster-home:/dagster-home
      - spark-events:/opt/spark-events
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - dagster-webserver

  # ══════════════════════════════════════════════════════════════════════════════
  # API LAYER (FastAPI)
  # ══════════════════════════════════════════════════════════════════════════════

  x-fastapi:
    profiles: ["dont-start"]
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    image: cryptoprice/fastapi:0.25.0
    restart: unless-stopped
    environment:
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_1M_RETENTION_DAYS: 90
      TRINO_HOST: trino
      TRINO_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_LMVIEW_DB: ${POSTGRES_LMVIEW_DB:-iceberg_catalog}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-168}
      AI_MODE: ${AI_MODE:-api}
      AI_ENABLE_REAL_LLM: "true"
      AI_ENABLE_RAG: ${AI_ENABLE_RAG:-true}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    networks:
      crypto-net:
        aliases:
          - fastapi
    depends_on:
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  fastapi-dev:
    extends: x-fastapi
    profiles: ["dev"]
    container_name: fastapi-dev
    hostname: fastapi-dev
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
    ports:
      - "8080:8000"
    networks:
      crypto-net:
        aliases:
          - fastapi
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost"
      RUN_MIGRATIONS: "true"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_INITIAL_PASSWORD: ${DEFAULT_ADMIN_INITIAL_PASSWORD:-change-me-admin-password}
      DEFAULT_ADMIN_DISPLAY_NAME: ${DEFAULT_ADMIN_DISPLAY_NAME:-LMView Admin}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}

  fastapi-prod:
    extends: x-fastapi
    profiles: ["prod"]
    container_name: fastapi-prod
    hostname: fastapi-prod
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8080:8000"
    networks:
      crypto-net:
        aliases:
          - fastapi
    volumes:
      - ./ai_service:/app/ai_service
      - ./backend:/app/backend
      - ./src:/app/src
    environment:
      CORS_ORIGINS: "https://${CERTBOT_DOMAIN:-localhost}"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_INITIAL_PASSWORD: ${DEFAULT_ADMIN_INITIAL_PASSWORD:-change-me-admin-password}
      DEFAULT_ADMIN_DISPLAY_NAME: ${DEFAULT_ADMIN_DISPLAY_NAME:-LMView Admin}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
    deploy:
      resources:
        limits:
          memory: 512M

  # ══════════════════════════════════════════════════════════════════════════════
  # FRONTEND (Nginx + React SPA)
  # ══════════════════════════════════════════════════════════════════════════════

  x-nginx:
    profiles: ["dont-start"]
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: cryptoprice/nginx:1.31.0
    restart: unless-stopped
    networks:
      crypto-net:
        aliases:
          - nginx
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost/.well-known/acme-challenge/ || exit 0",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-dev:
    extends: x-nginx
    profiles: ["dev"]
    container_name: nginx-dev
    hostname: nginx-dev
    ports:
      - "80:80"
    networks:
      crypto-net:
        aliases:
          - nginx
    depends_on:
      fastapi-dev:
        condition: service_healthy
    environment:
      - NGINX_MODE=dev
      - NGINX_AUTO_RELOAD_ENABLE=0
      - MONITORING_USER=${MONITORING_USER:-admin}
      - MONITORING_PASSWORD=${MONITORING_PASSWORD:-admin}

  nginx-prod:
    extends: x-nginx
    profiles: ["prod"]
    container_name: nginx-prod
    hostname: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      crypto-net:
        aliases:
          - nginx
    depends_on:
      fastapi-prod:
        condition: service_healthy
    environment:
      - NGINX_MODE=prod
      - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-localhost}
      - NGINX_AUTO_RELOAD_ENABLE=${NGINX_AUTO_RELOAD_ENABLE:-1}
      - NGINX_RELOAD_INTERVAL_SECONDS=${NGINX_RELOAD_INTERVAL_SECONDS:-21600}
      - MONITORING_USER=${MONITORING_USER:-admin}
      - MONITORING_PASSWORD=${MONITORING_PASSWORD:-admin}

  certbot-auto:
    profiles: ["prod"]
    image: certbot/certbot:v5.6.0
    container_name: certbot-auto
    restart: unless-stopped
    environment:
      - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_RENEW_INTERVAL_SECONDS=${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/certbot_auto.sh"]
    depends_on:
      nginx-prod:
        condition: service_started

  duckdns-auto:
    profiles: ["prod"]
    image: curlimages/curl:8.7.1
    container_name: duckdns-auto
    restart: unless-stopped
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
      - DUCKDNS_SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-}
      - DUCKDNS_UPDATE_INTERVAL_SECONDS=${DUCKDNS_UPDATE_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/duckdns_auto.sh"]

  # ══════════════════════════════════════════════════════════════════════════════
  # INFLUXDB BACKFILL (one-shot on startup – fills gap caused by machine downtime)
  # ══════════════════════════════════════════════════════════════════════════════

  influx-backfill:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/backfill/Dockerfile
    image: cryptoprice/influx-backfill:0.25.0
    container_name: influx-backfill
    restart: "no"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    networks:
      - crypto-net
    depends_on:
      influxdb:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════════════════════════
  # PRODUCER (Binance WebSocket → Kafka)
  # ══════════════════════════════════════════════════════════════════════════════

  producer:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    image: cryptoprice/producer:0.25.0
    container_name: producer
    hostname: producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KLINE_INTERVAL: "1s"
      KLINE_SYMBOLS_PER_CONN: "20"
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      ENABLE_OKX: "false"
      ENABLE_DIRECT_REDIS: "false"
    volumes:
      - ./:/app
    networks:
      - crypto-net
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f producer/main.py || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ══════════════════════════════════════════════════════════════════════════════
  # BINANCE WS TICKER FEED (Phase 4 — replaces dead producer's @ticker path)
  # ══════════════════════════════════════════════════════════════════════════════

  binance-ticker-ws:
    profiles: ["dev", "prod"]
    build:
      context: .
      dockerfile: docker/ticker-ws/Dockerfile
    image: cryptoprice/binance-ticker-ws:0.1.0
    container_name: binance-ticker-ws
    hostname: binance-ticker-ws
    restart: unless-stopped
    environment:
      REDIS_HOST: redis-master
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      TICKER_WS_SHARDS: "8"
      TICKER_WS_SYMBOLS_PER_SHARD: "100"
      TICKER_WS_TOP_N: "671"
      TICKER_WS_RECONNECT_BASE_MS: "1000"
      TICKER_WS_RECONNECT_MAX_MS: "30000"
      TICKER_WS_PING_INTERVAL_S: "30"
      TICKER_WS_TTL_S: "300"
      TICKER_WS_REDIS_FLUSH_MS: "50"
      TICKER_WS_REDIS_BUFFER_MAX: "2000"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9100"
      LOG_LEVEL: "INFO"
    networks:
      - crypto-net
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:9100/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ══════════════════════════════════════════════════════════════════════════════
  # MONITORING STACK (opt-in via --profile monitoring)
  # ══════════════════════════════════════════════════════════════════════════════

  redis-exporter:
    image: oliver006/redis_exporter:v1.83.0
    container_name: redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    command:
      - --redis.addr=redis-master:6379
    ports:
      - "9121:9121"
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - monitoring
    # NOTE: oliver006/redis_exporter is a minimal FROM-scratch Go image
    # with no shell, no busybox, no wget/curl/nc — every healthcheck
    # command (including ["CMD-SHELL", "exit 0"]) fails because
    # Docker cannot find a shell to interpret it. We rely on the
    # exporter's own /metrics endpoint (scrape error = visible in
    # Prometheus) instead of a Docker healthcheck.

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    ports:
      - "9090:9090"
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      # NOTE: prometheus runs with --web.route-prefix=/prometheus/ (Grafana
      # behind reverse proxy uses /prometheus/ as the sub-path). The
      # healthcheck URL MUST include that prefix, otherwise wget will
      # always 404 and the container will be marked unhealthy, which
      # cascades to fastapi-dev / fastapi-prod via depends_on.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
    ports:
      - "9308:9308"
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 64M
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Use the direct container port so the UI works without going
      # through the nginx reverse proxy (the user is accessing
      # `http://localhost:3001` directly during development and
      # `serve_from_sub_path` was causing 301 -> /grafana/login ->
      # /grafana/login loops when accessed on a different port).
      # The nginx-prod.conf `location /grafana/` still proxies the
      # same Grafana instance for production access.
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - crypto-net
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

  # ══════════════════════════════════════════════════════════════════════════════
  # LOGGING STACK (opt-in via --profile logging)
  # ══════════════════════════════════════════════════════════════════════════════

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    hostname: loki
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crypto-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - logging

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    hostname: promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - crypto-net
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - logging
