# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.ai.yml — AI Service override
#
# Adds a standalone ai-service container that runs LLM inference and
# LangGraph DAG orchestration. Backend proxies AI requests to this
# container when AI_SERVICE_EMBEDDED=false (default).
#
# Merge with the main compose file:
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
# Or for Swarm:
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml -c docker-compose.ai.yml cryptoprice
# ══════════════════════════════════════════════════════════════════════════════

services:
  ai-service:
    profiles: ["dev", "prod", "ai-api"]
    build:
      context: .
      dockerfile: docker/ai-service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-0.28.0}
    image: cryptoprice/ai-service:${AI_SERVICE_TAG:-latest}
    hostname: ai-service
    restart: unless-stopped
    environment:
      - AI_MODE=${AI_MODE:-api}
      - AI_CONFIG_PATH=${AI_CONFIG_PATH:-/app/ai_service/configs/ai.api.yaml}
      - AI_ORCHESTRATION=${AI_ORCHESTRATION:-langgraph}
      - AI_ENABLE_REAL_LLM=${AI_ENABLE_REAL_LLM:-true}
      - AI_SERVICE_EMBEDDED=false
      - AI_ENABLE_RAG=${AI_ENABLE_RAG:-true}
      - AI_RERANKER_MODEL=${AI_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_API_KEYS=${DASHSCOPE_API_KEYS:-}
      - DASHSCOPE_API_BASE_URLS=${DASHSCOPE_API_BASE_URLS:-}
      - REDIS_HOST=redis-master
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-mymaster}
      - REDIS_PORT=6379
      - REDIS_SENTINELS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_LMVIEW_DB=${POSTGRES_LMVIEW_DB:-iceberg_catalog}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # Mount KB docs for auto-ingestion at startup
      - ${PWD}/docs/ai/knowledge_base:/app/docs/ai/knowledge_base
    networks:
      - crypto-net
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

networks:
  crypto-net:
    name: cryptoprice_crypto-net
    external: true
