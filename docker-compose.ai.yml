version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# AI SERVICE — standalone FastAPI service
#
# Runs on the core node, exposes port 8100, and is reachable from the
# backend (FastAPI) on the same `crypto-net` overlay network. The backend
# proxies AI chat requests here instead of running AI logic in-process.
#
# Image tag follows the `cryptoprice/<name>:<tag>` convention so the
# deploy script's registry rewrite (`cryptoprice/*` → `${REGISTRY_ADDR}/cryptoprice/*`)
# rewrites it to the Swarm registry address automatically.
# ══════════════════════════════════════════════════════════════════════════════

services:
  ai-service:
    profiles: ["dev", "prod", "ai-api"]
    build:
      context: .
      dockerfile: docker/ai-service/Dockerfile
    image: cryptoprice/ai-service:latest
    hostname: ai-service
    environment:
      - AI_MODE=${AI_MODE:-api}
      - AI_CONFIG_PATH=${AI_CONFIG_PATH:-/app/ai_service/configs/ai.api.yaml}
      - AI_ORCHESTRATION=${AI_ORCHESTRATION:-langgraph}
      - AI_ENABLE_REAL_LLM=${AI_ENABLE_REAL_LLM:-true}
      - AI_SERVICE_EMBEDDED=false
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - REDIS_HOST=redis-master
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-mymaster}
      - REDIS_PORT=6379
      - REDIS_SENTINELS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_LMVIEW_DB=${POSTGRES_LMVIEW_DB:-iceberg_catalog}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    ports:
      - target: 8100
        published: 8100
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crypto-net
    deploy:
      placement:
        constraints: [node.labels.role == core]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G

networks:
  crypto-net:
    name: cryptoprice_crypto-net
    external: true
