# LMView Redis master configuration
# Mounted into redis-master, redis-replica-1, redis-replica-2
#
# replica-read-only=no ensures that if Sentinel promotes a replica to
# master, it stays writable. Without this, a promoted replica rejects
# writes with READONLY until manually CONFIG SET.
replica-read-only no

# Sentinel-managed nodes should never auto-replica-of on restart;
# let Sentinel handle topology.
replica-serve-stale-data yes
