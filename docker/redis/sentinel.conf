port 26379

# Monitor master named 'mymaster' at redis-master:6379
# Quorum of 2 means at least 2 sentinels must agree master is down
sentinel monitor mymaster redis-master 6379 2

# Master is considered down after 3 seconds (faster detection)
# Previous 5000ms was too slow for production
sentinel down-after-milliseconds mymaster 3000

# Only 1 replica can sync at a time during failover
sentinel parallel-syncs mymaster 1

# Failover timeout - 10 seconds (time for complete failover process)
sentinel failover-timeout mymaster 10000

# Disable script reconfiguration for security
sentinel deny-scripts-reconfig yes

# CRITICAL: Prevent sentinel from persisting configuration changes to disk
# This avoids stale topology after cluster reorganization
sentinel resolve-hostnames yes

# Announce this sentinel's IP to other sentinels (helps with Docker networking)
# Will be overridden by entrypoint script with actual container IP

# Log level
loglevel notice
