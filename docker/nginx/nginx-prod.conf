# ─────────────────────────────────────────────────────────────────────────────
# Nginx PROD configuration for LMView
# ─────────────────────────────────────────────────────────────────────────────
# HTTPS via Let's Encrypt (certbot webroot mode).
# CERTBOT_DOMAIN can be any domain: DuckDNS, custom, etc.
# - Serves React SPA static files at /
# - Proxies /api/* requests to FastAPI backend (fastapi:8000)
# - Handles WebSocket upgrade for /api/stream
# - Proxies /grafana/ → Grafana (own auth)
# - Proxies /prometheus/ → Prometheus (Basic Auth)
# - Proxies /loki/ → Loki (Basic Auth)
# - HTTPS via Let's Encrypt (certbot webroot mode)
# - Rate limiting and security headers
#
# NOTE: Monitoring/logging upstreams use variables so nginx starts even when
# those optional services are not running. Docker's embedded DNS (127.0.0.11)
# resolves them at request time instead of at startup.
# ─────────────────────────────────────────────────────────────────────────────

# Map to conditionally set Connection header for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting zones ───────────────────────────────────────────
# API: 30 requests/sec per IP with burst tolerance
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# WebSocket: 5 connections/sec per IP (initial handshake only)
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;
# Monitoring: 10 requests/sec per IP
limit_req_zone $binary_remote_addr zone=monitoring_limit:10m rate=10r/s;

# ── HTTP: ACME challenge + optional redirect to HTTPS ────────────
# When CERTBOT_DOMAIN is set, we expect a real cert at /etc/letsencrypt/...
# and we redirect all non-ACME HTTP traffic to HTTPS. When CERTBOT_DOMAIN
# is empty (dev / first-boot before certbot has run), we just serve
# a 200 placeholder so the user can verify nginx is up; they should
# use direct container ports (3001 Grafana, 8080 API) in that mode.
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Prometheus metrics stub_status
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    # Default location: ACME only when no cert is configured; otherwise
    # redirect to HTTPS (production). Use $certbot_domain which is empty
    # in dev mode.
    set $certbot_domain "${CERTBOT_DOMAIN}";
    location / {
        if ($certbot_domain = "") {
            return 200 "LMView HTTP mode (no cert). Use direct ports: 3001 (Grafana), 8080 (API), 9090 (Prometheus).";
            add_header Content-Type text/plain;
        }
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # Docker embedded DNS — allows deferred resolution of optional services
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/${CERTBOT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERTBOT_DOMAIN}/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request limits ────────────────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── WebSocket endpoint ────────────────────────────────────────
    location /api/stream {
        limit_req zone=ws_limit burst=10 nodelay;

        # Force DNS re-resolution every request so when Swarm reassigns
        # the fastapi overlay IP, nginx picks up the new IP immediately
        # instead of serving a stale cached IP that causes 502.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $fastapi_upstream http://fastapi-prod:8000;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        tcp_nodelay on;
    }

    # ── AI API proxy (longer timeout for model loading + LLM calls) ─
    location /api/ai/ {
        limit_req zone=api_limit burst=60 nodelay;

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $fastapi_upstream_ai http://fastapi-prod:8000;
        proxy_pass $fastapi_upstream_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
    }

    # ── REST API proxy ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $fastapi_upstream_rest http://fastapi-prod:8000;
        proxy_pass $fastapi_upstream_rest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Grafana (has built-in auth — no Basic Auth needed) ─────────
    location /grafana/ {
        limit_req zone=monitoring_limit burst=20 nodelay;

        set $grafana_upstream http://grafana:3000;
        # Trailing slash on proxy_pass strips the /grafana/ prefix because
        # Grafana is now served at root (GF_SERVER_SERVE_FROM_SUB_PATH=false).
        # This way /grafana/login (browser) -> /login (grafana).
        proxy_pass $grafana_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Grafana WebSocket (live dashboards)
    location /grafana/api/live/ {
        set $grafana_live_upstream http://grafana:3000;
        proxy_pass $grafana_live_upstream/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Prometheus (no built-in auth — Basic Auth required) ────────
    location /prometheus/ {
        limit_req zone=monitoring_limit burst=20 nodelay;

        auth_basic "Prometheus";
        auth_basic_user_file /etc/nginx/.htpasswd;

        set $prometheus_upstream http://prometheus:9090;
        proxy_pass $prometheus_upstream/prometheus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Loki (no built-in auth — Basic Auth required) ─────────────
    location /loki/ {
        limit_req zone=monitoring_limit burst=20 nodelay;

        auth_basic "Loki";
        auth_basic_user_file /etc/nginx/.htpasswd;

        set $loki_upstream http://loki:3100;
        proxy_pass $loki_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── React SPA (catch-all for client-side routing) ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching (Vite hashed bundles) ─────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Font and image caching ────────────────────────────────────
    location ~* \.(woff2?|ttf|eot|otf|ico|svg|png|jpg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
