# AI Service - Test/No-Provider Configuration
# Backend tests use fake providers directly. Production mock lives only in
# frontend VITE_DATA_SOURCE=mock mode.

mode: none
providers:
  - name: none
    type: none
    public_provider: none
    priority: 1

rag:
  enabled: false

inference:
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 5
