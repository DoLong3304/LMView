rag:
  enabled: true
  top_k: 6
  min_score: 0.25
  embedding_model: BAAI/bge-small-en-v1.5

inference:
  temperature: 0.3
  max_tokens: 2048
  top_p: 0.95
  timeout_seconds: 60
