# AI Service - API Mode Configuration
# Online provider catalog. Keys stay in env:
# - DASHSCOPE_API_KEY (preferred single key, legacy)
# - DASHSCOPE_API_KEYS (comma-separated multi-key for rotation)
# - QWEN_API_KEY (legacy alias)
#
# Model tiers:
#   standard  → default rotation for normal usage
#   reserved  → strong models reserved for manual/admin use only
#   benchmark → decent models for benchmark/automated testing
#
# The provider router honours `selected_model` and `model_tier` overrides
# from the AIChatRequest. When both are null/auto, it rotates through
# `standard` models in priority order.

mode: api
providers:

  # ════════════════════════════════════════════════════════════════════════
  # STANDARD TIER — default rotation, newest + efficient models
  # ════════════════════════════════════════════════════════════════════════

  # Primary: Qwen3.7-Plus (newest June 2026, best quality/price ratio)
  - name: dashscope-qwen3.7-plus
    type: litellm
    public_provider: api
    model: openai/qwen3.7-plus
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 10
    tier: standard
    cutoff: "2026-06"

  # Fallback 1: Qwen3.7-Max-Preview (July 2026 preview, best upcoming quality)
  - name: dashscope-qwen3.7-max-preview
    type: litellm
    public_provider: api
    model: openai/qwen3.7-max-preview
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 15
    tier: standard
    cutoff: "2026-07"

  # Fallback 2: Qwen3-Coder-Plus (best for tool-calling heavy tasks, Jul 2025)
  - name: dashscope-qwen3-coder-plus
    type: litellm
