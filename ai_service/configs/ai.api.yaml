# AI Service - API Mode Configuration
# Online provider catalog. Keys stay in env:
# - DASHSCOPE_API_KEY (preferred)
# - QWEN_API_KEY (legacy alias)

mode: api
providers:
  - name: dashscope-qwen
    type: litellm
    public_provider: api
    model: openai/qwen3.5-plus
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 10
    notes:
      endpoint: OpenAI-compatible Chat Completions
      usage_fields: prompt_tokens/completion_tokens/total_tokens
      native_dashscope_usage_fields: input_tokens/output_tokens/total_tokens

  - name: none
    type: none
    public_provider: none
    priority: 999

rag:
  enabled: true
  top_k: 6
  min_score: 0.25
  embedding_model: all-MiniLM-L6-v2

inference:
  temperature: 0.3
  max_tokens: 2048
  top_p: 0.95
  timeout_seconds: 60
