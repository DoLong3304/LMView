# LiteLLM proxy catalog for LMView AI.
# Unified LLM routing with health checks, retries, and auto-fallback.
#
# Model list mirrors ai.api.yaml providers. Each model includes
# caching headers to enable DashScope server-side context caching
# (reduces first-token latency by ~80% for repeated system prompts).

model_list:
  # ── DashScope API (Qwen cloud) ───────────────────────────────────────────
  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      extra_headers:
        X-DashScope-Cache: enable
        X-DashScope-SSE: enable
    model_info:
      mode: chat
      tier: standard
      notes: "Primary: June 2026, best quality/price ratio"

