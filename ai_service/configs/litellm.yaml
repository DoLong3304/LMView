litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 60

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  allowed_fails: 3
  enable_loadbalancing: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
