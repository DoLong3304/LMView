# LiteLLM proxy catalog for LMView AI.
# Main backend routing reads ai.api.yaml/ai.local.yaml directly.

model_list:
  - model_name: qwen3.5-plus
    litellm_params:
      model: openai/qwen3.5-plus
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
    model_info:
      notes: OpenAI-compatible usage uses prompt_tokens/completion_tokens/total_tokens.

  - model_name: local-vllm
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: http://vllm:8000/v1
      api_key: not-needed

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
