# AI Service - Local/Auto Mode Configuration
# Auto mode tries local first, then API, then none.

mode: auto
providers:
  - name: local-vllm
    type: vllm
    public_provider: local
    base_url: http://vllm:8000/v1
    model: Qwen/Qwen2.5-7B-Instruct
    priority: 1
    is_local: true

  - name: dashscope-qwen
    type: litellm
    public_provider: api
    model: openai/qwen3.5-plus
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 10
    notes:
      endpoint: OpenAI-compatible Chat Completions
      usage_fields: prompt_tokens/completion_tokens/total_tokens
      native_dashscope_usage_fields: input_tokens/output_tokens/total_tokens

  - name: none
    type: none
    public_provider: none
    priority: 999

rag:
  enabled: true
  top_k: 6
  min_score: 0.25
  embedding_model: all-MiniLM-L6-v2

inference:
  temperature: 0.3
  max_tokens: 2048
  top_p: 0.95
  timeout_seconds: 60
