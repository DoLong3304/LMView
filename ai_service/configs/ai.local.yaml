    base_url: https://ws-wajzbpjx2ma5ao95.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 30

  - name: dashscope-qwen3.6-plus
    type: litellm
    public_provider: api
    model: openai/qwen3.6-plus
    base_url: https://ws-wajzbpjx2ma5ao95.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 40

  - name: dashscope-qwen3.5-plus
    type: litellm
