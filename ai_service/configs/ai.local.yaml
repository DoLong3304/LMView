# AI Service - Local/Auto Mode Configuration
# Auto mode tries local first, then API, then none.

mode: auto
providers:
  - name: local-vllm
    type: vllm
    public_provider: local
    base_url: http://vllm:8000/v1
    model: Qwen/Qwen2.5-7B-Instruct
    priority: 1
    is_local: true

  - name: dashscope-qwen3.7-plus
    type: litellm
    public_provider: api
    model: openai/qwen3.7-plus
    base_url: https://ws-wajzbpjx2ma5ao95.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 10

  - name: dashscope-qwen3.7-max
    type: litellm
    public_provider: api
    model: openai/qwen3.7-max
    base_url: https://ws-wajzbpjx2ma5ao95.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    priority: 20

  - name: dashscope-qwen3.6-max-preview
    type: litellm
    public_provider: api
